name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  web-security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (high+)
        run: npm run security:deps

      - name: Lint
        run: npm run lint

      - name: Contract tests
        run: npm run test:contracts

      - name: Growth contracts
        run: npm run test:growth

      - name: Workspace and deal contracts
        run: npm run test:workspace-deals

      - name: People contracts
        run: npm run test:people

      - name: Inventory contracts
        run: npm run test:inventory

      - name: Shared UI contracts
        run: npm run test:shared-ui

      - name: Build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks compares the PR against the first parent of the base
          # commit; shallow checkout leaves that parent unavailable.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
